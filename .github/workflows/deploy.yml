name: Deploy SIGAPPA to Production

on:
  push:
    branches: [ main, finalisasi ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.175.204.247
          username: devel
          key: ${{ secrets.SSH_KEY }}
          port: 2244
          script: |
            cd /var/www/html/sigappa

            # 1. Update Source Code
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # 2. Backend Dependencies & Database
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force

            # 3. Frontend Build
            # Kita build di VPS karena keterbatasan setup saat ini,
            # gunakan --max-old-space-size untuk hemat RAM VPS
            export NODE_OPTIONS="--max-old-space-size=1024"
            npm install
            npm run build

            # 4. Sinkronisasi Aset ke Web Root
            # Ini CRITICAL karena VPS Anda menggunakan folder /build di luar sigappa
            echo "Syncing build assets to web root..."
            cp -r public/build/* ../build/

            # 5. Optimasi Laravel & Perbaikan Permission
            # Kita hapus file log lama jika ada masalah permission
            rm -f storage/logs/laravel.log || true

            # Clear & Cache
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Reset Permissions secara cerdas
            echo "Setting permissions..."
            # 1. Pastikan semua FOLDER di storage & bootstrap bisa diakses (775)
            find storage bootstrap/cache -type d -exec chmod 775 {} +
            
            # 2. Pastikan file yang DIMILIKI user 'devel' saja yang di-chmod (664)
            # Ini akan menghilangkan pesan "Operation not permitted"
            find storage bootstrap/cache -type f -user $(whoami) -exec chmod 664 {} +
            
            # 3. Khusus untuk folder build aset
            chmod -R 775 ../build || true

            echo "Deployment Berhasil! SIGAPPA sudah live. 🚀"
